<body>
<div class="app">
  <header>
    <div class="eyebrow" id="hEyebrow"></div>
    <h1 id="hTitle"></h1>
  </header>

  <main id="tab-home"></main>
  <main id="tab-plan" class="hidden"></main>
  <main id="tab-book" class="hidden"></main>
  <main id="tab-guide" class="hidden"></main>
  <main id="tab-info" class="hidden"></main>

  <footer id="foot"></footer>

<nav><div class="bar" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   VIEW — 렌더링 로직
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TODAY = new Date();
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const parse = s => new Date(s.includes('T') ? s : s+'T00:00:00');
const dayDiff = (a,b)=>Math.round((startOfDay(a)-startOfDay(b))/86400000);
const fmtMD = s => { const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); };
const DOW = ['일','월','화','수','목','금','토'];

function ddayText(dateStr){
  const n = dayDiff(parse(dateStr), TODAY);
  if(n>0) return 'D-'+n;
  if(n===0) return 'D-DAY';
  return 'D+'+(-n);
}

/* ── 상태 저장 ───────────────────────────────────────────── */
const KEY='trip2026.state';
/* file:// 또는 시크릿 모드에서 저장소가 막혀도 화면은 동작하도록 감쌉니다. */
const store = (()=>{
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t');
       return { get:k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v), del:k=>localStorage.removeItem(k), ok:true };
  }catch(e){ const mem={}; return { get:k=>mem[k]??null, set:(k,v)=>{mem[k]=v}, del:k=>{delete mem[k]}, ok:false }; }
})();
let state={};
try{ state = JSON.parse(store.get(KEY) || '{}') || {}; }catch(e){ state={}; }
const save = ()=>{ try{ store.set(KEY, JSON.stringify(state)); }catch(e){} };
function toggle(id){
  if(!EDITABLE){ toast('보기 전용이에요'); return; }
  state[id] = !state[id]; save(); render();
}

/* ── 내 기기 금고 ─────────────────────────────────────────
   private.js 가 없는 기기(폰 등)에서 비밀값과 확인서 PDF를 한 번 가져와
   이 브라우저에만 보관합니다. 비밀값은 localStorage, PDF는 IndexedDB.
   서버로는 아무것도 전송되지 않습니다. */
const VAULT_KEY='trip2026.vault';
let vaultSecrets=null;
try{ vaultSecrets = JSON.parse(store.get(VAULT_KEY)||'null'); }catch(e){ vaultSecrets=null; }
let vaultDocs = new Set();

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('indexedDB 없음')); return; }
    const q=indexedDB.open('trip2026-vault',1);
    q.onupgradeneeded=()=>{ q.result.createObjectStore('docs'); };
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
function idbReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function vaultDocPut(path,file){
  const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
  tx.objectStore('docs').put({name:file.name,type:file.type||'application/pdf',blob:file,savedAt:Date.now()},path);
  return new Promise((res,rej)=>{ tx.oncomplete=()=>{ vaultDocs.add(path); res(); }; tx.onerror=()=>rej(tx.error); });
}
async function vaultDocGet(path){ const db=await idbOpen(); return idbReq(db.transaction('docs').objectStore('docs').get(path)); }
async function vaultDocKeys(){ const db=await idbOpen(); return idbReq(db.transaction('docs').objectStore('docs').getAllKeys()); }
async function vaultDocDel(path){
  const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
  tx.objectStore('docs').delete(path);
  return new Promise((res,rej)=>{ tx.oncomplete=()=>{ vaultDocs.delete(path); res(); }; tx.onerror=()=>rej(tx.error); });
}
async function vaultClear(){
  store.del(VAULT_KEY); vaultSecrets=null;
  if(!localAmb()){ store.del(AMB_VAULT_KEY); TRIP.amb=null; }
  try{
    const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
    tx.objectStore('docs').clear();
    await new Promise(res=>{ tx.oncomplete=res; tx.onerror=res; });
  }catch(e){}
  vaultDocs.clear();
}
/* private.js 내용을 통째로 붙여넣으면 SECRETS 객체 부분만 뽑아 파싱합니다. */
function parseSecretsText(txt){
  const s=txt.indexOf('{'), e2=txt.lastIndexOf('}');
  if(s<0||e2<=s) throw new Error('형식 오류');
  const obj=(new Function('"use strict";return ('+txt.slice(s,e2+1)+')'))();
  if(!obj||typeof obj!=='object') throw new Error('형식 오류');
  const out={};
  for(const k in obj){ if(typeof obj[k]==='string'&&obj[k].trim()) out[k]=obj[k].trim(); }
  if(Object.keys(out).length===0) throw new Error('값 없음');
  return out;
}
/* IndexedDB에 저장한 PDF를 blob URL로 엽니다. 팝업 차단 대비로 창을 먼저 엽니다. */
function openVaultDoc(path){
  let w=null; try{ w=window.open('','_blank'); }catch(e){}
  vaultDocGet(path).then(rec=>{
    if(!rec){ if(w)w.close(); toast('저장된 파일이 없어요'); return; }
    const url=URL.createObjectURL(rec.blob);
    if(w) w.location=url; else location.href=url;
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }).catch(()=>{ if(w)w.close(); toast('파일을 열지 못했어요'); });
}
/* 대시보드가 참조하는 확인서 목록 (예약 카드 + 자료 체크리스트) */
function expectedDocs(){
  const list=[];
  const add=(path,label)=>{ if(path&&!list.some(x=>x.path===path)) list.push({path,label}); };
  TRIP.bookings.forEach(b=>{ add(b.doc, b.title+(b.doc2?' · 승차권':' · 확인서')); add(b.doc2, b.title+' · 좌석 예약서'); });
  TRIP.docs.forEach(x=>add(x.file, x.label));
  return list;
}

/* private.js 가 있으면(심볼릭 링크 환경) 그 값을, 없으면 가져온 값을 씁니다. */
const localFiles = ()=> typeof SECRETS !== 'undefined' && !!SECRETS;
const secret = (k)=>{
  if(typeof SECRETS !== 'undefined' && SECRETS && SECRETS[k]) return SECRETS[k];
  if(vaultSecrets && vaultSecrets[k]) return vaultSecrets[k];
  return null;
};
const hasSecrets = ()=> (typeof SECRETS !== 'undefined' && SECRETS && Object.keys(SECRETS).length > 0)
                     || (vaultSecrets && Object.keys(vaultSecrets).length > 0);
/* 확인서 버튼: 로컬 파일이 있으면 링크, 가져온 PDF가 있으면 blob 열기, 둘 다 없으면 숨김 */
function docBtn(path,label){
  if(!path) return '';
  if(localFiles()) return `<a class="btn" href="${path}" target="_blank" rel="noopener">${label}</a>`;
  if(vaultDocs.has(path)) return `<button class="btn" data-doc="${esc(path)}">${label}</button>`;
  return '';
}
/* 공유용 웹(Pages)에서는 보기 전용. private.js 또는 가져온 비밀값이 있는 내 기기에서만 편집 가능. */
let EDITABLE = hasSecrets();
/* AMB 가이드: amb.js(AMB_DATA) → 없으면 금고(localStorage)에 붙여넣은 사본 */
const AMB_VAULT_KEY='trip2026.amb';
const localAmb = ()=> typeof AMB_DATA !== 'undefined' && !!AMB_DATA;
if(localAmb()) TRIP.amb = AMB_DATA;
else { try{ TRIP.amb = JSON.parse(store.get(AMB_VAULT_KEY)||'null'); }catch(e){ TRIP.amb=null; } }

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1600);
}
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast('복사했어요')).catch(()=>toast('복사하지 못했어요'));
}

/* ── 헤더 ───────────────────────────────────────────────── */
function renderHeader(){
  $('#hEyebrow').textContent = TRIP.subtitle + ' · ' + (TRIP.days-1) + '박 ' + TRIP.days + '일';
  $('#hTitle').textContent = TRIP.title;
  $('#foot').textContent = store.ok

function renderHome(){

  const dLeft = dayDiff(parse(TRIP.startDate), TODAY);
  const totalTodo = TRIP.todos.length;
  const doneTodo = TRIP.todos.filter(t=>t.done||state[t.id]).length;
  const pct = Math.round(doneTodo/totalTodo*100);

  root.appendChild(el(`
    <div class="hero">
      <div class="h-lab">출발까지</div>
      <div class="h-num">${dLeft>0?('D-'+dLeft):(dLeft===0?'D-DAY':'여행 중')}</div>

      <div class="h-bar"><i style="width:${pct}%"></i></div>
      <div class="h-meta"><span>예약 준비 ${doneTodo}/${totalTodo}</span><span>${pct}%</span></div>
    </div>`));

  /* 마감 */
  /* 남은 마감을 먼저, 지난 항목은 뒤로 */
  const dl = TRIP.deadlines.slice().sort((a,b)=>{
    const pa = dayDiff(parse(a.date),TODAY) < 0, pb = dayDiff(parse(b.date),TODAY) < 0;

  const dlCard = el('<div class="card"></div>');
  dl.forEach(d=>{
    const n = dayDiff(parse(d.date), TODAY);

    dlCard.appendChild(el(`

        </div>
        <div class="rv"><span class="chip ${tone}">${passed?'지남':ddayText(d.date)}</span></div>
      </div>`));
  });
  if(!EDITABLE){
    root.appendChild(el('<div class="card"><div class="note">공유용 보기 전용 화면이에요. 체크 상태는 바꿀 수 없습니다.</div></div>'));
  }
  root.appendChild(el('<div class="sec-title">마감</div>'));
  root.appendChild(dlCard);

  /* 가장 급한 일 */
  const next = TRIP.todos.filter(t=>!(t.done||state[t.id])).slice(0,3);
  root.appendChild(el('<div class="sec-title">지금 할 일</div>'));
  if(next.length===0){
    root.appendChild(el('<div class="card"><div class="card-pad muted">남은 예약이 없어요.</div></div>'));
  } else {
    const c = el('<div class="card"></div>');
    next.forEach(t=>{
      c.appendChild(el(`
        <div class="chk" data-id="${t.id}">
          ${icon(t.type,true)}
          <div class="ct"><b>${esc(t.title)}</b><small>${esc(t.when)}${t.why?' · '+esc(t.why):''}</small></div>
          ${t.urgent?'<span class="chip red">최우선</span>':''}
          <div class="box">${checkSvg()}</div>
        </div>`));
    });

  }

  /* 확정 요약 */
  root.appendChild(el('<div class="sec-title">확정된 것</div>'));
  const cc = el('<div class="card"></div>');
  TRIP.bookings.forEach(b=>{
    cc.appendChild(el(`

        <div class="rv">${fmtMD(b.date)}</div>
      </div>`));
  });
  root.appendChild(cc);
  bindChecks(root);
}

/* ── 일정 ───────────────────────────────────────────────── */
/* ── 하루 동선 지도 (Leaflet + CARTO 타일, 키 불필요) ─────────────
   데이터: TRIP.routes["YYYY-MM-DD"] = {…} 또는 [{title,…},…] (안이 여러 개면 칩으로 전환)
   stop = {t,name,lat,lng,d,stay,move,by} — move는 이 정차까지 오는 방법 텍스트,
   by는 walk(기본)·transit·train·flight·bus·taxi·ferry·run. walk가 아니면 걷기 합계에서 뺍니다. */
let leafletP=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(leafletP) return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    sc.onload=()=>res(window.L); sc.onerror=()=>{ leafletP=null; rej(new Error('leaflet')); };
    document.head.appendChild(sc);
  });
  return leafletP;
}
function haverKm(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng); const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const isWalkLeg = (x)=> !x.by || x.by==='walk';
function legText(a,b){
  if(b.move) return b.move;
  const km=haverKm(a,b)*1.3; const min=Math.max(2,Math.round(km/4*60));
  return '도보 약 '+min+'분 · '+(km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km');
}
function routeVariants(date){ const r=TRIP.routes&&TRIP.routes[date]; if(!r) return []; return Array.isArray(r)?r:[r]; }
function walkKm(r){ return r.stops.slice(1).reduce((acc,x,i)=>acc+(isWalkLeg(x)?haverKm(r.stops[i],x)*1.3:0),0); }
function gmapsDirUrl(r){
  const s=r.stops; const p=x=>x.lat+','+x.lng;
  const wp=s.slice(1,-1).slice(0,9).map(p).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin='+p(s[0])+'&destination='+p(s[s.length-1])+(wp?'&waypoints='+encodeURIComponent(wp):'')+'&travelmode='+(r.mode||'walking');
}
function routeHTML(d, color){
  const vs=routeVariants(d.date); if(!vs.length) return '';
  let idx=state['route.'+d.date]|0; if(idx>=vs.length) idx=0;
  const r=vs[idx]; if(!r.stops||r.stops.length<2) return '';
  const km=walkKm(r);
  const tabs=vs.length>1?'<div class="gsub" style="padding:0 0 10px">'+vs.map((v,i)=>'<button class="fc '+(i===idx?'on':'')+'" data-rv="'+i+'">'+esc(v.title||('안 '+(i+1)))+'</button>').join('')+'</div>':'';
  const li=r.stops.map((x,i)=>{
    const leg=i>0?'<div class="rleg'+(isWalkLeg(x)?'':' t')+'">↓ '+esc(legText(r.stops[i-1],x))+'</div>':'';
    return leg+'<li><span class="rn" style="background:'+color+'">'+(i+1)+'</span><div class="rt"><b><span>'+esc(x.t||'')+'</span>'+esc(x.name)+(x.stay?' <span class="chip" style="font-size:11px;padding:1px 6px;margin-left:4px">'+esc(x.stay)+'</span>':'')+'</b>'+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div></li>';
  }).join('');
  return '<div class="route" data-route="'+esc(d.date)+'" data-rv-idx="'+idx+'"><div class="rhead">동선 <span class="chip">'+r.stops.length+'곳'+(km>0.3?' · 걷기 약 '+km.toFixed(1)+'km':'')+'</span>'+(r.tentative?'<span class="chip orange">확정 대기</span>':'')+'</div>'
    +tabs
    +'<div class="rmap"><div class="gal-note">지도 불러오는 중…</div></div>'
    +(r.note?'<div class="rnote">'+esc(r.note)+'</div>':'')
    +'<ul class="rstops">'+li+'</ul>'
    +'<a class="btn" href="'+esc(gmapsDirUrl(r))+'" target="_blank" rel="noopener">구글맵 길찾기로 열기 (전체 경로)</a></div>';
}
let routeMaps={};
function mountRouteMap(box, date, color){
  const idx=box.dataset.rvIdx|0, key=date+'#'+idx;
  const r=routeVariants(date)[idx]; if(!r) return;
  const mapEl=box.querySelector('.rmap'); if(!mapEl) return;
  if(routeMaps[key]&&routeMaps[key]._container===mapEl){ setTimeout(()=>routeMaps[key].invalidateSize(),50); return; }
  loadLeaflet().then(L=>{
    mapEl.innerHTML='';
    const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    const map=L.map(mapEl,{scrollWheelZoom:false,attributionControl:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/'+(dark?'dark_all':'light_all')+'/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
    const pts=r.stops.map(x=>[x.lat,x.lng]);
    r.stops.forEach((x,i)=>{
      if(i===0) return;
      const seg=[[r.stops[i-1].lat,r.stops[i-1].lng],[x.lat,x.lng]];
      if(isWalkLeg(x)) L.polyline(seg,{color:color,weight:4,opacity:.85,dashArray:'1 8',lineCap:'round'}).addTo(map);
      else L.polyline(seg,{color:color,weight:2.5,opacity:.45}).addTo(map);
    });
    r.stops.forEach((x,i)=>{
      L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:'<div class="rmark" style="background:'+color+'">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map).bindPopup('<b>'+(i+1)+'. '+esc(x.name)+'</b>'+(x.t?'<br>'+esc(x.t):''));
    });
    map.fitBounds(pts,{padding:[28,28]});
    routeMaps[key]=map;
    setTimeout(()=>map.invalidateSize(),50);
  }).catch(()=>{ mapEl.innerHTML='<div class="gal-note">지도를 불러오지 못했어요. 인터넷이 연결되면 다시 시도합니다. 아래 버튼으로 구글맵에서 볼 수 있어요.</div>'; });
}

/* 사진: 위키백과 REST API(CORS 허용)에서 문서의 이미지 목록을 받아 앞쪽 3~4장을 씁니다.
   이 파일에는 이미지 파일명을 적지 않아도 되고, 링크가 깨질 일이 적습니다. 오프라인이면 안내만 보입니다. */
const IMG_SKIP=/map|karte|mapa|flag|bandeira|flagge|logo|icon|coat|escudo|bras[aã]o|wappen|plan\b|diagram|\.svg|locat|localiza|lage|stamp|selo|briefmarke|banknote|moeda|münze|coin|signature|assinatura|unterschrift/i;
const imgCache={};
function galleryHTML(spot){
  const explicit=(spot.images||[]);
  if(explicit.length){
    return '<div class="gal">'+explicit.map(im=>{
      const src='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(im.file)+'?width=800';
      return '<figure><img loading="lazy" src="'+src+'" alt="" onerror="this.parentNode.remove()"><figcaption>'+esc(im.caption||im.file.replace(/\.[a-z]+$/i,'').replace(/_/g,' '))+' · Wikimedia Commons</figcaption></figure>';
    }).join('')+'</div>';
  }
  return '<div class="gal" data-wiki-gal="'+esc(spot.id)+'"><div class="gal-note">사진 불러오는 중…</div></div>';
}
function loadWikiGallery(spot, box){
  if(!spot.wiki){ box.innerHTML='<div class="gal-note">사진 없음</div>'; return; }
  const key=spot.wiki.lang+':'+spot.wiki.title;
  const paint=(items)=>{
    if(!items.length){ box.innerHTML='<div class="gal-note">쓸 만한 사진을 찾지 못했어요</div>'; return; }
    box.innerHTML=items.map(it=>'<figure><img loading="lazy" src="'+it.src+'" alt="" onerror="this.parentNode.remove()"><figcaption>'+esc(it.caption)+' · Wikimedia Commons</figcaption></figure>').join('');
  };
  if(imgCache[key]){ paint(imgCache[key]); return; }
  const url='https://'+spot.wiki.lang+'.wikipedia.org/api/rest_v1/page/media-list/'+encodeURIComponent(spot.wiki.title.replace(/ /g,'_'));
  const ctrl=('AbortController' in window)?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),9000):null;
  fetch(url,{signal:ctrl?ctrl.signal:undefined}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
    const items=(j.items||[]).filter(it=>it.type==='image'&&it.srcset&&it.srcset.length&&!IMG_SKIP.test(it.title||''));
    items.sort((a,b)=>(b.leadImage?1:0)-(a.leadImage?1:0));
    const out=items.slice(0,spot.imgCount||4).map(it=>{
      let src=it.srcset[0].src; if(src.startsWith('//')) src='https:'+src;
      src=src.replace(/\/(\d+)px-/,'/720px-');
      const cap=(it.caption&&it.caption.text)?it.caption.text:(it.title||'').replace(/^File:/,'').replace(/\.[a-z]+$/i,'').replace(/_/g,' ');
      return {src, caption:cap.length>70?cap.slice(0,70)+'…':cap};
    });
    imgCache[key]=out; paint(out);
  }).catch(()=>{ box.innerHTML='<div class="gal-note">사진을 불러오지 못했어요. 인터넷이 연결되면 다시 시도합니다.</div>'; })
    .finally(()=>{ if(timer) clearTimeout(timer); });
}
function spotBodyHTML(s){
  const pr=s.practical||{};
  const kv=[['운영',pr.hours],['요금',pr.price],['예약',pr.booking],['팁',pr.tip]].filter(x=>x[1]).map(x=>'<div class="kv"><div class="k">'+x[0]+'</div><div class="v" style="font-weight:500">'+esc(x[1])+'</div></div>').join('');

    list.sort((a,b)=>(a.prio||9)-(b.prio||9)||String(a.booth).localeCompare(String(b.booth)));
    const card=el('<div class="card"></div>');
    if(!list.length) card.appendChild(el('<div class="card-pad muted">'+(cat==='want'?'별표를 눌러 꼭 갈 부스를 담아두세요.':'해당 부스가 없어요.')+'</div>'));
    list.forEach(b=>card.appendChild(ambBoothNode(b)));
    root.appendChild(card);
  }
  if(all||sub==='insight'){
    (A.insights||[]).forEach(b=>{ root.appendChild(el('<div class="gall-title" style="font-size:18px;page-break-before:auto">'+esc(b.title)+'</div>')); root.appendChild(el('<div class="card">'+bgSectionHTML(b)+'</div>')); });
    if(!(A.insights||[]).length) root.appendChild(el('<div class="card"><div class="card-pad muted">조사 결과를 정리하는 중이에요.</div></div>'));
  }
  if(all||sub==='practical'){
    if(all) root.appendChild(el('<div class="gall-title" style="font-size:18px;page-break-before:auto">실용</div>'));
    root.appendChild(el('<div class="card">'+etiquetteHTML(A.practical||[])+'</div>'));
    if(A.sources&&A.sources.length) root.appendChild(el('<div class="gbg" style="padding:0 4px"><p class="muted" style="font-size:12.5px">출처: '+A.sources.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--blue)">'+esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])+'</a>').join(' · ')+'</p></div>'));
  }
}

function renderGuide(){
  const root=$('#tab-guide'); root.innerHTML='';
  const g=G(); const all=document.body.classList.contains('guide-all');
  root.appendChild(el('<div class="sec-title">가이드</div>'));
  root.appendChild(el('<div class="sec-desc">'+esc(g.note||'명소·배경지식·맛집을 도시별로 모았어요.')+(g.updated?' ('+esc(g.updated)+' 정리)':'')+'</div>'));
  const tools=el('<div class="gtools"><button class="btn">'+(all?'접어서 보기':'전체 펼쳐 보기 · 인쇄용')+'</button></div>');
  tools.querySelector('.btn').addEventListener('click',()=>{ document.body.classList.toggle('guide-all'); renderGuide(); window.scrollTo(0,0); if(document.body.classList.contains('guide-all')) toast('공유 → 인쇄 → PDF로 저장하면 오프라인 사본이 돼요'); });
  root.appendChild(tools);
  if(!g.cities.length){ root.appendChild(el('<div class="card"><div class="card-pad muted">가이드를 준비하고 있어요.</div></div>')); return; }

  if(all){ /* 전체 펼침: 도시 순서대로 명소 전부 + 배경지식 */
    g.cities.forEach(c=>{
      root.appendChild(el('<div class="gall-title" style="color:'+(c.color||'var(--t1)')+'">'+esc(c.name)+'</div>'));
      if(c.intro) root.appendChild(el('<div class="gcity">'+esc(c.intro)+'</div>'));
      const card=el('<div class="card"></div>'); g.spots.filter(s=>s.city===c.id).forEach(s=>card.appendChild(spotNode(s))); root.appendChild(card);
    });
    if(TRIP.amb){ root.appendChild(el('<div class="gall-title">'+esc(TRIP.amb.name||'AMB')+'</div>')); renderAmb(root,'plan',true); }
    g.background.forEach(b=>{ root.appendChild(el('<div class="gall-title">'+esc(b.title)+'</div>')); root.appendChild(el('<div class="card">'+bgSectionHTML(b)+'</div>')); });
    if(g.keywords.length){ root.appendChild(el('<div class="gall-title">문화 키워드</div>')); root.appendChild(el('<div class="card">'+keywordsHTML(g.keywords)+'</div>')); }
    if(g.etiquette.length){ root.appendChild(el('<div class="gall-title">에티켓 · 실용</div>')); root.appendChild(el('<div class="card">'+etiquetteHTML(g.etiquette)+'</div>')); }
    return;
  }

  const extra=(TRIP.amb?[{id:'amb',name:TRIP.amb.shortName||'AMB'}]:[]).concat([{id:'bg',name:'배경지식'}]);
  const cityIds=g.cities.map(c=>c.id).concat(extra.map(x=>x.id));
  let city=state['guide.city']; if(!cityIds.includes(city)) city=g.cities[0].id;
  const bar=el('<div class="fchips"></div>');
  g.cities.concat(extra).forEach(c=>{
    const b=el('<button class="fc '+(c.id===city?'on':'')+'">'+esc(c.name)+'</button>');
    b.addEventListener('click',()=>{ state['guide.city']=c.id; state['guide.sub']=null; save(); renderGuide(); });
    bar.appendChild(b);
  });
  root.appendChild(bar);

  if(city==='amb'){ renderAmb(root, state['guide.sub'], false); return; }
  if(city==='bg'){
    const subs=g.background.map(b=>({id:b.id,name:b.title})).concat(g.keywords.length?[{id:'kw',name:'문화 키워드'}]:[]).concat(g.etiquette.length?[{id:'et',name:'에티켓 · 실용'}]:[]);
    let sub=state['guide.sub']; if(!subs.some(s=>s.id===sub)) sub=subs[0]&&subs[0].id;
    const sb=el('<div class="gsub"></div>');
    subs.forEach(s=>{ const b=el('<button class="fc '+(s.id===sub?'on':'')+'">'+esc(s.name)+'</button>'); b.addEventListener('click',()=>{ state['guide.sub']=s.id; save(); renderGuide(); }); sb.appendChild(b); });
    root.appendChild(sb);
    if(sub==='kw') root.appendChild(el('<div class="card">'+keywordsHTML(g.keywords)+'</div>'));
    else if(sub==='et') root.appendChild(el('<div class="card">'+etiquetteHTML(g.etiquette)+'</div>'));
    else { const b=g.background.find(x=>x.id===sub); if(b) root.appendChild(el('<div class="card">'+bgSectionHTML(b)+'</div>')); }
    return;
  }

  const c=g.cities.find(x=>x.id===city);
  const hasFood=TRIP.food.some(f=>f.city===c.foodCity||f.city===c.name);
  const subs=[{id:'spots',name:'명소'}].concat(hasFood?[{id:'food',name:'맛집'}]:[]);
  let sub=state['guide.sub']; if(!subs.some(s=>s.id===sub)) sub='spots';
  const sb=el('<div class="gsub"></div>');
  subs.forEach(s=>{ const b=el('<button class="fc '+(s.id===sub?'on':'')+'">'+esc(s.name)+'</button>'); b.addEventListener('click',()=>{ state['guide.sub']=s.id; save(); renderGuide(); }); sb.appendChild(b); });
  root.appendChild(sb);

  if(sub==='food'){ const box=el('<div></div>'); root.appendChild(box); renderFood(box, c.foodCity||c.name); return; }
  if(c.intro) root.appendChild(el('<div class="gcity">'+esc(c.intro)+'</div>'));
  const spots=g.spots.filter(s=>s.city===c.id);
  const card=el('<div class="card"></div>');
  spots.forEach(s=>card.appendChild(spotNode(s)));
  if(!spots.length) card.appendChild(el('<div class="card-pad muted">이 도시 명소는 준비 중이에요.</div>'));
  root.appendChild(card);
}

/* ── 정보 ───────────────────────────────────────────────── */
function renderInfo(){
  const root=$('#tab-info'); root.innerHTML='';

  /* 짐 체크리스트 — 체크 상태는 state['pack.<id>'], 기기별 저장 */
  if(TRIP.packing && TRIP.packing.groups){
    const P=TRIP.packing;
    const all=P.groups.flatMap(g=>g.items.map(i=>'pack.'+i.id));
    const done=all.filter(k=>state[k]).length;
    root.appendChild(el('<div class="sec-title">짐 체크리스트</div>'));
    root.appendChild(el(`<div class="sec-desc">${esc(P.note)} (${esc(P.updated)} 기준)</div>`));
    const pct=all.length?Math.round(done/all.length*100):0;
    root.appendChild(el(`
      <div class="card"><div class="prog">
        <div class="pt" style="flex:1"><b>${done} / ${all.length} 챙김</b><small>${done===all.length?'다 쌌어요':(pct+'% · 체크는 이 기기에만 저장돼요')}</small>
          <div style="height:6px;border-radius:99px;background:var(--card-sub);margin-top:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--blue);border-radius:99px;transition:width .2s"></div></div>
        </div>
      </div></div>`));
    P.groups.forEach(g=>{
      const gdone=g.items.filter(i=>state['pack.'+i.id]).length;
      const card=el(`<div class="card"><div class="note" style="font-weight:700;color:var(--t1)">${esc(g.title)} <span style="font-weight:500;color:var(--t3)">${gdone}/${g.items.length}</span></div></div>`);
      g.items.forEach(i=>{
        card.appendChild(el(`
          <div class="chk ${state['pack.'+i.id]?'on':''}" data-id="pack.${i.id}">
            <div class="box">${checkSvg()}</div>
            <div class="ct"><b>${esc(i.t)}</b>${i.note?'<small>'+esc(i.note)+'</small>':''}</div>
          </div>`));
      });
      root.appendChild(card);
    });
    bindChecks(root);
    if(EDITABLE){
      const pr=el('<div class="card"><div class="btn-row" style="padding:12px 20px"><button class="btn" id="btnPackReset">짐 체크만 초기화</button></div></div>');
      root.appendChild(pr);
      pr.querySelector('#btnPackReset').addEventListener('click',()=>{ if(confirm('짐 체크를 모두 지울까요?')){ all.forEach(k=>delete state[k]); save(); render(); toast('짐 체크를 비웠어요'); } });
    }
  }

  root.appendChild(el('<div class="sec-title">알아둘 것</div>'));
  const r = el('<div class="card"></div>');
  TRIP.risks.forEach(x=>{
    r.appendChild(el(`<div class="row"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`));
  });
  root.appendChild(r);

  /* 날씨 */
  root.appendChild(el('<div class="sec-title">날씨</div>'));
  root.appendChild(el(`<div class="sec-desc">${esc(TRIP.weather.note)} (${esc(TRIP.weather.updated)} 조사)</div>`));
  const w = el('<div class="card"></div>');
  TRIP.weather.cities.forEach(c=>{
    const color=(TRIP.cities[c.city]||{}).color||'#8B95A1';
    const node = el(`
      <div class="row">
        <div class="rt">
          <b><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></span>${esc(c.city)} <span class="muted" style="font-weight:600">${esc(c.when)}</span></b>
          <small>비 ${esc(c.rain)}<br><span style="opacity:.9">${esc(c.tip)}</span></small>
        </div>
        <div class="rv" style="white-space:nowrap"><b>${c.hi}°</b> <span class="muted">/ ${c.lo}°</span></div>
      </div>`);
    w.appendChild(node);
  });
  root.appendChild(w);

  const wh = el('<div class="card"></div>');
  TRIP.weather.highlights.forEach(x=>{
    wh.appendChild(el(`<div class="row"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`));
  });
  wh.appendChild(el(`<div class="note">챙길 것<br>${TRIP.weather.packing.map(x=>'· '+esc(x)).join('<br>')}</div>`));
  root.appendChild(wh);

  root.appendChild(el('<div class="sec-title">앵커 이벤트</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="row"><div class="rt"><b>AMB 2026</b><small>국제 금속가공 전시회 · 2026/09/15~19 · Messe Stuttgart (공항 옆)</small></div><div class="rv">9/19 관람</div></div>
      <div class="row"><div class="rt"><b>옥토버페스트</b><small>2026/09/19~10/04 · Theresienwiese, 뮌헨</small></div><div class="rv">9/20</div></div>
    </div>`));

  root.appendChild(el('<div class="sec-title">동행</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="card-pad">
        <div class="kv"><div class="k">대상</div><div class="v">뮌헨 9/19~22 · 포르투 9/22~25 · 리스본 9/25~28</div></div>
        <div class="kv"><div class="k">모집처</div><div class="v">네이버 카페 유랑</div></div>
        <div class="kv"><div class="k">비고</div><div class="v">슈투트가르트 제외 · 부분 동행 환영</div></div>
      </div>
      <div class="btn-row"><a class="btn primary" href="${TRIP.openChat}" target="_blank" rel="noopener">오픈채팅 열기</a></div>
    </div>`));

  /* 내 기기 데이터 — private.js 없는 기기(폰)에서 비밀값·확인서를 가져와 보관 */
  root.appendChild(el('<div class="sec-title">내 기기 데이터</div>'));
  if(localFiles()){
    root.appendChild(el('<div class="card"><div class="note">이 기기는 private.js 를 직접 읽고 있어요. 가져오기가 필요 없습니다.</div></div>'));
  } else {
    const nSec = vaultSecrets ? Object.keys(vaultSecrets).length : 0;
    const card = el(`<div class="card">
      <div class="card-pad">
        <div class="kv"><div class="k">비밀값</div><div class="v">${nSec? nSec+'개 가져옴' : '없음'}</div></div>
        <div class="kv"><div class="k">확인서</div><div class="v">${vaultDocs.size}개 저장됨</div></div>
        <div class="kv"><div class="k">AMB 가이드</div><div class="v">${TRIP.amb?'가져옴':'없음'}</div></div>
      </div>
      <div class="note">여기서 가져온 값과 파일은 이 브라우저에만 저장되고 어디로도 전송되지 않아요. 내 폰에서만 쓰고, 공용 기기에서는 사용하지 마세요.</div>
      <div class="btn-row" style="padding-top:16px">
        <button class="btn" id="vSecBtn">private.js · amb.js 붙여넣기</button>
        ${(nSec||vaultDocs.size||TRIP.amb)?'<button class="btn" id="vClrBtn">모두 지우기</button>':''}
      </div>
      <div id="vSecBox" class="hidden" style="padding:0 20px 16px">
        <textarea id="vSecTa" rows="6" placeholder="private.js 또는 amb.js 내용 전체를 붙여넣으세요 (한 번에 하나씩)" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:none;background:var(--card-sub);color:inherit;font-family:inherit;font-size:13px"></textarea>
        <div class="btn-row" style="padding:8px 0 0"><button class="btn primary" id="vSecSave">저장</button></div>
      </div>
      <div id="vDocRows"></div>
    </div>`);
    root.appendChild(card);

    const rows = card.querySelector('#vDocRows');
    expectedDocs().forEach(dc=>{
      const have = vaultDocs.has(dc.path);
      const row = el(`<div class="row">
        <div class="rt"><b>${esc(dc.label)}</b><small>${have?'저장됨 · 눌러서 열기':'없음'}</small></div>
        <div class="rv">
          ${have?`<button class="chip" data-doc="${esc(dc.path)}" style="border:none;cursor:pointer;font-family:inherit">열기</button> `:''}
          <label class="chip ${have?'':'blue'}" style="cursor:pointer">${have?'교체':'추가'}<input type="file" accept="application/pdf,.pdf" hidden></label>
        </div>
      </div>`);
      row.querySelector('input[type=file]').addEventListener('change',e=>{
        const f=e.target.files[0]; if(!f) return;
        vaultDocPut(dc.path,f).then(()=>{ toast('저장했어요'); render(); }).catch(()=>toast('저장하지 못했어요'));
      });
      const openBtn=row.querySelector('[data-doc]');
      if(openBtn) openBtn.addEventListener('click',()=>openVaultDoc(dc.path));
      rows.appendChild(row);
    });

    $('#vSecBtn').addEventListener('click',()=>{ $('#vSecBox').classList.toggle('hidden'); });
    $('#vSecSave').addEventListener('click',()=>{
      const raw=$('#vSecTa').value||'';
      if(/AMB_DATA/.test(raw)){
        try{
          const st=raw.indexOf('{'), en=raw.lastIndexOf('}');
          const obj=(new Function('"use strict";return ('+raw.slice(st,en+1)+')'))();
          if(!obj||!obj.booths) throw new Error('형식 오류');
          store.set(AMB_VAULT_KEY, JSON.stringify(obj)); TRIP.amb=obj;
          toast('AMB 가이드를 가져왔어요 (부스 '+obj.booths.length+'곳)'); render();
        }catch(e){ toast('amb.js 내용을 읽지 못했어요. 파일 전체를 붙여넣어 주세요'); }
        return;
      }
      try{
        const parsed = parseSecretsText(raw);
        store.set(VAULT_KEY, JSON.stringify(parsed));
        vaultSecrets = parsed; EDITABLE = hasSecrets();
        toast(Object.keys(parsed).length+'개 값을 가져왔어요'); render();
      }catch(e){ toast('내용을 읽지 못했어요. 파일 전체를 붙여넣어 주세요'); }
    });
    const clr=$('#vClrBtn');
    if(clr) clr.addEventListener('click',()=>{
      if(!confirm('가져온 비밀값과 확인서를 이 기기에서 모두 지울까요?')) return;
      vaultClear().then(()=>{ EDITABLE = hasSecrets(); render(); toast('지웠어요'); });
    });
  }

  if(EDITABLE){
    root.appendChild(el('<div class="sec-title">데이터 관리</div>'));
    const reset = el('<div class="card"><div class="btn-row" style="padding:16px 20px"><button class="btn" id="btnReset">체크 상태 초기화</button></div></div>');
    root.appendChild(reset);
    $('#btnReset').addEventListener('click',()=>{
      if(confirm('체크한 내용을 모두 지울까요?')){ store.del(KEY); for(const k in state) delete state[k]; render(); toast('초기화했어요'); }
    });
  }
}

function bindChecks(root){
  root.querySelectorAll('.chk').forEach(n=>{
    n.addEventListener('click',()=>toggle(n.dataset.id));
  });
}

/* ── 탭 ─────────────────────────────────────────────────── */
const TABS=[{id:'home',label:'홈'},{id:'plan',label:'일정'},{id:'book',label:'예약'},{id:'guide',label:'가이드'},{id:'info',label:'정보'}];
let cur = store.get('trip2026.tab') || 'home';
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  TABS.forEach(t=>{
    const b=el(`<button class="${cur===t.id?'on':''}">${t.label}</button>`);
    b.addEventListener('click',()=>{ cur=t.id; store.set('trip2026.tab',cur); render(); window.scrollTo(0,0); });
    nav.appendChild(b);
  });
  TABS.forEach(t=>$('#tab-'+t.id).classList.toggle('hidden', t.id!==cur));
}

function render(){
  document.body.classList.toggle('readonly', !EDITABLE);
  renderHeader();
  renderHome(); renderPlan(); renderBook(); renderGuide(); renderInfo();
  renderNav();
}
render();
/* 저장된 확인서 목록을 불러온 뒤 문서 버튼이 뜨도록 다시 그립니다. */
if(!localFiles() && window.indexedDB){
  vaultDocKeys().then(keys=>{ vaultDocs=new Set(keys); if(keys.length) render(); }).catch(()=>{});
}
</script>
