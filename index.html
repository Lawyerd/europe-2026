  font-size:15px; line-height:1.5;
}
.app{max-width:460px;margin:0 auto;padding:0 16px calc(112px + var(--safe-b));}

/* ── Header ─────────────────────────────────────────────── */
header{padding:28px 4px 12px}
header .eyebrow{font-size:13px;color:var(--t3);font-weight:600}
header h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.04em}

/* ── Card / ListRow ─────────────────────────────────────── */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:20px}
.sec-title{font-size:19px;font-weight:800;margin:24px 4px 10px;letter-spacing:-.03em}
.sec-desc{font-size:13px;color:var(--t3);margin:-6px 4px 10px}

.row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em}
.row .rt small{display:block;font-size:13px;color:var(--t3);margin-top:2px;line-height:1.45}
.row .rv{font-size:14px;color:var(--t2);font-weight:600;white-space:nowrap}

.kv{display:flex;gap:12px;padding:7px 0;font-size:14.5px;align-items:flex-start}
.kv .k{width:62px;flex:none;color:var(--t3);font-weight:500}
.kv .v{flex:1;color:var(--t1);font-weight:600;word-break:break-word}
.kv .v.warn{color:var(--red)}

/* ── Type icon (Toss style: 둥근 사각 바탕 + 단색 픽토그램) ── */
.ic{width:40px;height:40px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card-sub);color:var(--t3)}
.ic svg{width:22px;height:22px;fill:currentColor}
.ic.flight{background:var(--blue-bg);color:var(--blue)}
.ic.seat{background:var(--blue-bg);color:var(--blue)}
.ic.train{background:var(--green-bg);color:var(--green)}
.ic.tour{background:var(--green-bg);color:var(--green)}
.ic.stay{background:var(--orange-bg);color:var(--orange)}
.ic.ticket{background:var(--purple-bg);color:var(--purple)}
.ic.sm{width:34px;height:34px;border-radius:11px}
.ic.sm svg{width:19px;height:19px}

/* ── Collapsible booking card ─────────────────────────── */
.bk .bk-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.bk .bk-head .bt{flex:1;min-width:0}
.bk .bk-head .bt b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.03em}
.bk .bk-head .bt small{display:block;font-size:13px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .bk-head .chev{width:20px;height:20px;flex:none;color:var(--t4);transition:transform .18s}
.bk .bk-head .chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bk.open .bk-head .chev{transform:rotate(180deg)}
.bk .bk-body{display:none;border-top:1px solid var(--line)}
.bk.open .bk-body{display:block}
.bk .bk-body .card-pad{padding-top:14px}

/* ── Todo row (expandable) ─────────────────────────────── */
.td{border-top:1px solid var(--line)}
.td:first-child{border-top:none}
.td .td-head{display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer}
.td .td-head .tt{flex:1;min-width:0}
.td .td-head .tt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.03em}
.td .td-head .tt small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px}
.td.done .td-head .tt b{color:var(--t4);text-decoration:line-through}
.td.done .ic{background:var(--card-sub);color:var(--t4)}
.td .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;cursor:pointer}
.td .box svg{opacity:0;width:12px;height:12px}
.td.done .box{background:var(--blue);border-color:var(--blue)}
.td.done .box svg{opacity:1}
.td .td-body{display:none;padding:0 20px 14px 72px;font-size:13.5px;color:var(--t2);line-height:1.55}
.td.open .td-body{display:block}

/* ── Chips / Badges ─────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 8px;border-radius:var(--r-sm);background:var(--card-sub);color:var(--t2)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.orange{background:var(--orange-bg);color:var(--orange)}

/* ── Hero (D-day) ───────────────────────────────────────── */
.hero{background:linear-gradient(135deg,#3182F6,#2272EB);color:#fff;border-radius:var(--r-lg);padding:24px 20px;margin-bottom:12px}
.hero .h-lab{font-size:13px;opacity:.85;font-weight:600}
.hero .h-num{font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1.1;margin-top:2px}
.hero .h-sub{font-size:14px;opacity:.9;margin-top:6px}
.hero .h-bar{height:6px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:16px;overflow:hidden}
.hero .h-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .h-meta{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:8px}

/* ── Progress ───────────────────────────────────────────── */
.prog{display:flex;align-items:center;gap:14px;padding:20px}
.ring{width:56px;height:56px;flex:none}
.prog .pt b{font-size:17px;font-weight:700;display:block}
.prog .pt small{font-size:13px;color:var(--t3)}

/* ── Timeline ───────────────────────────────────────────── */
.day{position:relative;padding:16px 20px 16px 52px;border-top:1px solid var(--line);cursor:pointer}
.day:first-child{border-top:none}
.day::before{content:"";position:absolute;left:27px;top:0;bottom:0;width:2px;background:var(--line)}
.day:first-child::before{top:24px}
.day:last-child::before{bottom:auto;height:24px}
.day .dot{position:absolute;left:22px;top:19px;width:12px;height:12px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px currentColor;z-index:1}
.day .dhead{display:flex;align-items:baseline;gap:8px}
.day .ddate{font-size:13px;color:var(--t3);font-weight:700;width:58px;flex:none}
.day .dlab{font-size:16px;font-weight:700;letter-spacing:-.03em;flex:1}
.day .dmeta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.day .dbody{display:none;margin-top:12px}
.day.open .dbody{display:block}
.day ul{margin:0;padding:0;list-style:none}
.day li{font-size:14px;color:var(--t2);padding:5px 0 5px 14px;position:relative}
.day li::before{content:"";position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--t4)}
.tip{margin-top:10px;background:var(--card-sub);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;color:var(--t2);line-height:1.55}
.tip b{color:var(--t1);display:block;margin-bottom:2px;font-size:13px}
.opts{margin-top:10px}
.opts .o{font-size:13.5px;color:var(--t2);background:var(--card-sub);border-radius:var(--r-md);padding:10px 12px;margin-top:6px;line-height:1.5}

/* ── Checkbox row ───────────────────────────────────────── */
.chk{display:flex;gap:12px;padding:14px 20px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.chk:first-child{border-top:none}
.chk .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line-strong);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.chk .box svg{opacity:0;width:12px;height:12px}
.chk.on .box{background:var(--blue);border-color:var(--blue)}
.chk.on .box svg{opacity:1}
.chk .ct{flex:1;min-width:0}
.chk .ct b{font-size:15.5px;font-weight:600;display:block;letter-spacing:-.03em}
.chk.on .ct b{color:var(--t4);text-decoration:line-through}
.chk .ct small{display:block;font-size:13px;color:var(--t3);margin-top:3px;line-height:1.5}
.chk .rank{width:22px;height:22px;flex:none;border-radius:7px;background:var(--card-sub);color:var(--t3);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}

/* ── Buttons ────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:var(--r-md);background:var(--card-sub);color:var(--t2);font-size:14.5px;font-weight:700;border:none;text-decoration:none;cursor:pointer;font-family:inherit;letter-spacing:-.02em}
.btn.primary{background:var(--blue);color:#fff}
.btn-row{display:flex;gap:8px;padding:0 20px 20px}

/* ── Tab bar (floating) ─────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));display:flex;justify-content:center;pointer-events:none;z-index:50}
nav .bar{pointer-events:auto;display:flex;gap:2px;background:var(--card);border-radius:99px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,.12);border:1px solid var(--line)}
nav button{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--t3);padding:10px 18px;border-radius:99px;cursor:pointer;letter-spacing:-.02em}
nav button.on{background:var(--t1);color:var(--card)}

.hidden{display:none}
.muted{font-size:13px;color:var(--t3);line-height:1.6}
.note{padding:14px 20px;background:var(--card-sub);font-size:13.5px;color:var(--t2);line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:rgba(25,31,40,.92);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--t4);padding:20px 0 0}
</style>
<script src="private.js" onerror="void 0"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow" id="hEyebrow"></div>
    <h1 id="hTitle"></h1>
  </header>

  <main id="tab-home"></main>
  <main id="tab-plan" class="hidden"></main>
  <main id="tab-book" class="hidden"></main>
  <main id="tab-info" class="hidden"></main>

  <footer id="foot"></footer>
</div>

<nav><div class="bar" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   VIEW — 렌더링 로직
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TODAY = new Date();
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const parse = s => new Date(s.includes('T') ? s : s+'T00:00:00');
const dayDiff = (a,b)=>Math.round((startOfDay(a)-startOfDay(b))/86400000);
const fmtMD = s => { const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); };
const DOW = ['일','월','화','수','목','금','토'];

function ddayText(dateStr){
  const n = dayDiff(parse(dateStr), TODAY);
  if(n>0) return 'D-'+n;
  if(n===0) return 'D-DAY';
  return 'D+'+(-n);
}

/* ── 상태 저장 ───────────────────────────────────────────── */
const KEY='trip2026.state';
/* file:// 또는 시크릿 모드에서 저장소가 막혀도 화면은 동작하도록 감쌉니다. */
const store = (()=>{
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t');
       return { get:k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v), del:k=>localStorage.removeItem(k), ok:true };
  }catch(e){ const mem={}; return { get:k=>mem[k]??null, set:(k,v)=>{mem[k]=v}, del:k=>{delete mem[k]}, ok:false }; }
})();
let state={};
try{ state = JSON.parse(store.get(KEY) || '{}') || {}; }catch(e){ state={}; }
const save = ()=>{ try{ store.set(KEY, JSON.stringify(state)); }catch(e){} };
function toggle(id){ state[id] = !state[id]; save(); render(); }

/* private.js 가 있으면 예약번호·PIN 같은 값을 채웁니다. 없으면 가려서 보여줍니다. */
const secret = (k)=> (typeof SECRETS !== 'undefined' && SECRETS && SECRETS[k]) ? SECRETS[k] : null;
const hasSecrets = ()=> typeof SECRETS !== 'undefined' && SECRETS && Object.keys(SECRETS).length > 0;

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1600);
}
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast('복사했어요')).catch(()=>toast('복사하지 못했어요'));
}

/* ── 헤더 ───────────────────────────────────────────────── */
function renderHeader(){
  $('#hEyebrow').textContent = TRIP.subtitle + ' · ' + (TRIP.days-1) + '박 ' + TRIP.days + '일';
  $('#hTitle').textContent = TRIP.title;
  $('#foot').textContent = store.ok
    ? 'index.html 상단 TRIP 객체를 고치면 화면에 반영됩니다.'
    : '이 브라우저에서는 체크 상태가 저장되지 않아요. 새로고침하면 초기화됩니다.';
}

/* ── 홈 ─────────────────────────────────────────────────── */
function renderHome(){
  const root=$('#tab-home'); root.innerHTML='';
  const dLeft = dayDiff(parse(TRIP.startDate), TODAY);
  const totalTodo = TRIP.todos.length;
  const doneTodo = TRIP.todos.filter(t=>state[t.id]).length;
  const pct = Math.round(doneTodo/totalTodo*100);

  root.appendChild(el(`
    <div class="hero">
      <div class="h-lab">출발까지</div>
      <div class="h-num">${dLeft>0?('D-'+dLeft):(dLeft===0?'D-DAY':'여행 중')}</div>
      <div class="h-sub">2026년 9월 18일 금요일 09:50 · 인천 T1 출발</div>
      <div class="h-bar"><i style="width:${pct}%"></i></div>
      <div class="h-meta"><span>예약 준비 ${doneTodo}/${totalTodo}</span><span>${pct}%</span></div>
    </div>`));

  /* 마감 */
  /* 남은 마감을 먼저, 지난 항목은 뒤로 */
  const dl = TRIP.deadlines.slice().sort((a,b)=>{
    const pa = dayDiff(parse(a.date),TODAY) < 0, pb = dayDiff(parse(b.date),TODAY) < 0;
    if(pa!==pb) return pa?1:-1;
    return parse(a.date)-parse(b.date);
  });
  const dlCard = el('<div class="card"></div>');
  dl.forEach(d=>{
    const n = dayDiff(parse(d.date), TODAY);
    const passed = n<0;
    const tone = passed ? '' : (n<=14 ? 'red' : (d.tone==='blue'?'blue':''));
    dlCard.appendChild(el(`
      <div class="row">
        <div class="rt">
          <b>${esc(d.label)}${d.estimate?' <span class="chip">추정</span>':''}</b>
          <small>${fmtMD(d.date)} ${d.date.includes('T')?d.date.split('T')[1]:''} · ${esc(d.desc)}</small>
        </div>
        <div class="rv"><span class="chip ${tone}">${passed?'지남':ddayText(d.date)}</span></div>
      </div>`));
  });
  root.appendChild(el('<div class="sec-title">마감</div>'));
  root.appendChild(dlCard);

  /* 가장 급한 일 */
  const next = TRIP.todos.filter(t=>!state[t.id]).slice(0,3);
  root.appendChild(el('<div class="sec-title">지금 할 일</div>'));
  if(next.length===0){
    root.appendChild(el('<div class="card"><div class="card-pad muted">남은 예약이 없어요.</div></div>'));
  } else {
    const c = el('<div class="card"></div>');
    next.forEach(t=>{
      c.appendChild(el(`
        <div class="chk" data-id="${t.id}">
          ${icon(t.type,true)}
          <div class="ct"><b>${esc(t.title)}</b><small>${esc(t.when)}${t.why?' · '+esc(t.why):''}</small></div>
          ${t.urgent?'<span class="chip red">최우선</span>':''}
          <div class="box">${checkSvg()}</div>
        </div>`));
    });
    root.appendChild(c);
  }

  /* 확정 요약 */
  root.appendChild(el('<div class="sec-title">확정된 것</div>'));
  const cc = el('<div class="card"></div>');
  TRIP.bookings.forEach(b=>{
    cc.appendChild(el(`
      <div class="row">
        ${icon(b.type,true)}
        <div class="rt"><b>${esc(b.title)}</b><small>${esc(b.sub)}</small></div>
        <div class="rv">${fmtMD(b.date)}</div>
      </div>`));
  });
  root.appendChild(cc);
  bindChecks(root);
}

function checkSvg(){
  return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
/* 항목 유형 아이콘 — 인라인 SVG (이모지 대신) */
const ICONS = {
  flight: '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>',
  train:  '<path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H14l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>',
  stay:   '<path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>',
  ticket: '<path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>',
  tour:   '<path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>',
  seat:   '<path d="M7.59 5.41c-.78-.78-.78-2.05 0-2.83.78-.78 2.05-.78 2.83 0 .78.78.78 2.05 0 2.83-.79.79-2.05.79-2.83 0zM6 16V7H4v9c0 2.76 2.24 5 5 5h6v-2H9c-1.66 0-3-1.34-3-3zm14 4.07L14.93 15H11.5v-3.68c1.4 1.15 3.6 2.16 5.5 2.16v-2.16c-1.66.02-3.61-.87-4.67-2.04l-1.4-1.55c-.19-.21-.43-.38-.69-.5-.29-.14-.62-.23-.96-.23h-.03C8.01 7 7 8.01 7 9.25V15c0 1.66 1.34 3 3 3h5.07l3.5 3.5L20 20.07z"/>',
  post:   '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>'
};
const TYPE_LABEL = { flight:'항공', train:'기차', stay:'숙소', ticket:'입장권', tour:'투어', seat:'좌석', post:'게시' };
function icon(type, small){
  const t = ICONS[type] ? type : 'post';
  return `<div class="ic ${t} ${small?'sm':''}" aria-label="${TYPE_LABEL[t]}"><svg viewBox="0 0 24 24">${ICONS[t]}</svg></div>`;
}
const chevSvg = '<span class="chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';

function moveIcon(type){
  if(type==='flight') return '<span class="chip blue">항공</span>';
  if(type==='train')  return '<span class="chip green">기차</span>';
  return '';
}

/* ── 일정 ───────────────────────────────────────────────── */
function renderPlan(){
  const root=$('#tab-plan'); root.innerHTML='';
  root.appendChild(el('<div class="sec-title">전체 일정</div>'));
  root.appendChild(el('<div class="sec-desc">날짜를 누르면 상세가 열립니다.</div>'));
  const card = el('<div class="card"></div>');

  TRIP.itinerary.forEach((d,i)=>{
    /* 이동일은 도착 도시 색으로 표시 */
    const cityKey = (d.city === '이동' && d.stay && TRIP.cities[d.stay]) ? d.stay : d.city;
    const color = (TRIP.cities[cityKey]||{}).color || '#8B95A1';
    const openKey = 'day.'+d.date;
    const isOpen = !!state[openKey];
    const past = dayDiff(parse(d.date), TODAY) < 0;
    const node = el(`
      <div class="day ${isOpen?'open':''}" data-day="${openKey}" style="${past?'opacity:.5':''}">
        <span class="dot" style="color:${color}"></span>
        <div class="dhead">
          <span class="ddate">${fmtMD(d.date)} ${d.dow}</span>
          <span class="dlab">${esc(d.label)}</span>
          <span class="chip">${ddayText(d.date)}</span>
        </div>
        <div class="dmeta">
          ${d.move?moveIcon(d.move):''}
          ${d.stay?`<span class="chip">${esc(d.stay)} 숙박${d.stayFixed?' · 확정':''}</span>`:''}
          ${d.flexible?'<span class="chip orange">유연한 날</span>':''}
        </div>
        <div class="dbody">
          <ul>${(d.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          ${d.options?`<div class="opts">${d.options.map(o=>`<div class="o">${esc(o)}</div>`).join('')}</div>`:''}
          ${d.tip?`<div class="tip"><b>참고</b>${esc(d.tip)}</div>`:''}
        </div>
      </div>`);
    card.appendChild(node);
  });
  root.appendChild(card);

  root.appendChild(el('<div class="sec-title">숙박 배분</div>'));
  root.appendChild(el(`
    <div class="card"><div class="card-pad">
      <div class="kv"><div class="k">슈투트가르트</div><div class="v">1박 · 9/18 <span class="chip green">확정</span></div></div>
      <div class="kv"><div class="k">뮌헨</div><div class="v">4박 · 9/19~23 <span class="chip red">미정</span></div></div>
      <div class="kv"><div class="k">포르투</div><div class="v">3박 · 9/23~26 <span class="chip red">미정</span></div></div>
      <div class="kv"><div class="k">리스본</div><div class="v">2박 · 9/26~28 <span class="chip red">미정</span></div></div>
      <div class="kv"><div class="k">기내</div><div class="v">1박 · 9/28</div></div>
    </div></div>`));

  root.querySelectorAll('.day').forEach(n=>{
    n.addEventListener('click',()=>{ const k=n.dataset.day; state[k]=!state[k]; save(); n.classList.toggle('open'); });
  });
}

/* ── 예약 ───────────────────────────────────────────────── */
function renderBook(){
  const root=$('#tab-book'); root.innerHTML='';

  root.appendChild(el('<div class="sec-title">확정 예약</div>'));
  root.appendChild(el('<div class="sec-desc">항목을 누르면 상세가 열립니다.</div>'));
  if(!hasSecrets()){
    root.appendChild(el('<div class="card"><div class="note">예약번호와 PIN은 이 화면에 저장돼 있지 않아요. 내 컴퓨터의 private.js 가 있는 환경에서만 보입니다. 현장에서는 Booking.com 앱이나 항공사 앱에서 확인하세요.</div></div>'));
  }
  TRIP.bookings.forEach(b=>{
    const key='bk.'+b.id, open=!!state[key];
    const card = el(`<div class="card bk ${open?'open':''}" data-key="${key}">
      <div class="bk-head">
        ${icon(b.type)}
        <div class="bt"><b>${esc(b.title)}</b><small>${fmtMD(b.date)} · ${esc(b.sub)}</small></div>
        <span class="chip green">확정</span>
        ${chevSvg}
      </div>
      <div class="bk-body">
        <div class="card-pad">
          ${b.rows.map(r=>{
            const sv = r.sk ? secret(r.sk) : null;
            const v  = r.sk ? (sv ?? '비공개') : r.v;
            const hidden = r.sk && sv === null;
            return `<div class="kv"><div class="k">${esc(r.k)}</div><div class="v ${r.warn?'warn':''}">${esc(v)}${(r.copy && !hidden)?` <button class="chip blue" data-copy="${esc(v)}" style="border:none;cursor:pointer;font-family:inherit">복사</button>`:''}${hidden?' <span class="chip">내 기기에서만</span>':''}</div></div>`;
          }).join('')}
          ${b.breakdown?`<div class="muted" style="margin-top:6px">${esc(b.breakdown)}</div>`:''}
          ${b.channel?`<div class="muted" style="margin-top:6px">예약처 ${esc(b.channel)}</div>`:''}
          ${!b.docSubmitted?'<div style="margin-top:12px"><span class="chip red">확인서 미제출</span></div>':''}
        </div>
        ${b.note?`<div class="note">${esc(b.note)}</div>`:''}
        ${(b.map||(b.doc && hasSecrets()))?`<div class="btn-row" style="padding-top:16px">
          ${b.map?`<a class="btn" href="${b.map}" target="_blank" rel="noopener">지도</a>`:''}
          ${(b.doc && hasSecrets())?`<a class="btn" href="${b.doc}" target="_blank" rel="noopener">확인서 열기</a>`:''}
        </div>`:''}
      </div>
    </div>`);
    card.querySelector('.bk-head').addEventListener('click',()=>{ state[key]=!state[key]; save(); card.classList.toggle('open'); });
    root.appendChild(card);
  });

  root.appendChild(el('<div class="sec-title">남은 예약</div>'));
  root.appendChild(el('<div class="sec-desc">우선순위 순입니다. 줄을 누르면 설명이 열리고, 오른쪽 박스로 완료 표시를 해요.</div>'));
  const c = el('<div class="card"></div>');
  TRIP.todos.forEach(t=>{
    const okey='td.'+t.id;
    const node = el(`
      <div class="td ${state[t.id]?'done':''} ${state[okey]?'open':''}">
        <div class="td-head">
          ${icon(t.type)}
          <div class="tt"><b>${esc(t.title)}</b><small>${esc(t.when)} · ${TYPE_LABEL[t.type]||''}${t.urgent && !state[t.id]?' · <span class="chip red" style="padding:2px 6px;font-size:11px">최우선</span>':''}</small></div>
          <div class="box" data-id="${t.id}">${checkSvg()}</div>
        </div>
        ${t.why?`<div class="td-body">${esc(t.why)}</div>`:''}
      </div>`);
    node.querySelector('.td-head').addEventListener('click',e=>{
      if(e.target.closest('.box')) return;
      if(!t.why) return;
      state[okey]=!state[okey]; save(); node.classList.toggle('open');
    });
    node.querySelector('.box').addEventListener('click',e=>{ e.stopPropagation(); toggle(t.id); });
    c.appendChild(node);
  });
  root.appendChild(c);

  root.appendChild(el('<div class="sec-title">뮌헨 숙소 후보</div>'));
  const m = el('<div class="card"></div>');
  TRIP.munichCandidates.forEach(x=>{
    m.appendChild(el(`
      <div class="row">
        ${icon('stay',true)}
        <div class="rt"><b>${esc(x.name)}${x.rank?` <span class="chip blue">${esc(x.rank)}</span>`:''}</b><small>${esc(x.note)}</small></div>
        <div class="rv">${x.rating? x.rating.toFixed(1) : '—'}</div>
      </div>`));
  });
  m.appendChild(el(`<div class="note">${esc(TRIP.munichRule)}</div>`));
  root.appendChild(m);

  root.appendChild(el('<div class="sec-title">받아야 할 자료</div>'));
  root.appendChild(el('<div class="sec-desc">확인서를 받으면 docs 에 넣고 체크하세요.</div>'));
  const d = el('<div class="card"></div>');
  TRIP.docs.forEach(x=>{
    if(x.done){
      d.appendChild(el(`
        <div class="row">
          <div class="rt"><b>${esc(x.label)}</b><small>${esc(x.need)}</small></div>
          <div class="rv">${(x.file && hasSecrets())?`<a class="chip blue" href="${x.file}" target="_blank" rel="noopener" style="text-decoration:none">열기</a>`:'<span class="chip green">확인</span>'}</div>
        </div>`));
    } else {
      d.appendChild(el(`
        <div class="chk ${state[x.id]?'on':''}" data-id="${x.id}">
          <div class="box">${checkSvg()}</div>
          <div class="ct"><b>${esc(x.label)}</b><small>${esc(x.need)}</small></div>
        </div>`));
    }
  });
  root.appendChild(d);

  bindChecks(root);
  root.querySelectorAll('[data-copy]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();copy(b.dataset.copy);});
  });
}

/* ── 정보 ───────────────────────────────────────────────── */
function renderInfo(){
  const root=$('#tab-info'); root.innerHTML='';

  root.appendChild(el('<div class="sec-title">알아둘 것</div>'));
  const r = el('<div class="card"></div>');
  TRIP.risks.forEach(x=>{
    r.appendChild(el(`<div class="row"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`));
  });
  root.appendChild(r);

  root.appendChild(el('<div class="sec-title">앵커 이벤트</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="row"><div class="rt"><b>AMB 2026</b><small>국제 금속가공 전시회 · 2026/09/15~19 · Messe Stuttgart (공항 옆)</small></div><div class="rv">9/19 관람</div></div>
      <div class="row"><div class="rt"><b>옥토버페스트</b><small>2026/09/19~10/04 · Theresienwiese, 뮌헨</small></div><div class="rv">9/20·22</div></div>
    </div>`));

  root.appendChild(el('<div class="sec-title">동행</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="card-pad">
        <div class="kv"><div class="k">대상</div><div class="v">뮌헨 9/19~23 · 포르투 9/23~26 · 리스본 9/26~28</div></div>
        <div class="kv"><div class="k">모집처</div><div class="v">네이버 카페 유랑</div></div>
        <div class="kv"><div class="k">비고</div><div class="v">슈투트가르트 제외 · 부분 동행 환영</div></div>
      </div>
      <div class="btn-row"><a class="btn primary" href="${TRIP.openChat}" target="_blank" rel="noopener">오픈채팅 열기</a></div>
    </div>`));

  root.appendChild(el('<div class="sec-title">데이터 관리</div>'));
  const reset = el('<div class="card"><div class="btn-row" style="padding:16px 20px"><button class="btn" id="btnReset">체크 상태 초기화</button></div></div>');
  root.appendChild(reset);
  $('#btnReset').addEventListener('click',()=>{
    if(confirm('체크한 내용을 모두 지울까요?')){ store.del(KEY); for(const k in state) delete state[k]; render(); toast('초기화했어요'); }
  });
}

function bindChecks(root){
  root.querySelectorAll('.chk').forEach(n=>{
    n.addEventListener('click',()=>toggle(n.dataset.id));
  });
}

/* ── 탭 ─────────────────────────────────────────────────── */
const TABS=[{id:'home',label:'홈'},{id:'plan',label:'일정'},{id:'book',label:'예약'},{id:'info',label:'정보'}];
let cur = store.get('trip2026.tab') || 'home';
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  TABS.forEach(t=>{
    const b=el(`<button class="${cur===t.id?'on':''}">${t.label}</button>`);
    b.addEventListener('click',()=>{ cur=t.id; store.set('trip2026.tab',cur); render(); window.scrollTo(0,0); });
    nav.appendChild(b);
  });
  TABS.forEach(t=>$('#tab-'+t.id).classList.toggle('hidden', t.id!==cur));
}

function render(){
  renderHeader();
  renderHome(); renderPlan(); renderBook(); renderInfo();
  renderNav();
}
render();
</script>
</body>
</html>
