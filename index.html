nav button{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--t3);padding:10px 18px;border-radius:99px;cursor:pointer;letter-spacing:-.02em}

.hidden{display:none}
.muted{font-size:13px;color:var(--t3);line-height:1.6}
.note{padding:14px 20px;background:var(--card-sub);font-size:13.5px;color:var(--t2);line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:rgba(25,31,40,.92);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--t4);padding:20px 0 0}
</style>
<script src="private.js" onerror="void 0"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow" id="hEyebrow"></div>
    <h1 id="hTitle"></h1>
  </header>

  <main id="tab-home"></main>
  <main id="tab-plan" class="hidden"></main>
  <main id="tab-book" class="hidden"></main>
  <main id="tab-food" class="hidden"></main>
  <main id="tab-info" class="hidden"></main>

  <footer id="foot"></footer>
</div>

<nav><div class="bar" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   VIEW — 렌더링 로직
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TODAY = new Date();
const startOfDay = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const parse = s => new Date(s.includes('T') ? s : s+'T00:00:00');
const dayDiff = (a,b)=>Math.round((startOfDay(a)-startOfDay(b))/86400000);
const fmtMD = s => { const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); };
const DOW = ['일','월','화','수','목','금','토'];

function ddayText(dateStr){
  const n = dayDiff(parse(dateStr), TODAY);
  if(n>0) return 'D-'+n;
  if(n===0) return 'D-DAY';
  return 'D+'+(-n);
}

/* ── 상태 저장 ───────────────────────────────────────────── */
const KEY='trip2026.state';
/* file:// 또는 시크릿 모드에서 저장소가 막혀도 화면은 동작하도록 감쌉니다. */
const store = (()=>{
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t');
       return { get:k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v), del:k=>localStorage.removeItem(k), ok:true };
  }catch(e){ const mem={}; return { get:k=>mem[k]??null, set:(k,v)=>{mem[k]=v}, del:k=>{delete mem[k]}, ok:false }; }
})();
let state={};
try{ state = JSON.parse(store.get(KEY) || '{}') || {}; }catch(e){ state={}; }
const save = ()=>{ try{ store.set(KEY, JSON.stringify(state)); }catch(e){} };
function toggle(id){
  if(!EDITABLE){ toast('보기 전용이에요'); return; }
  state[id] = !state[id]; save(); render();
}

/* ── 내 기기 금고 ─────────────────────────────────────────
   private.js 가 없는 기기(폰 등)에서 비밀값과 확인서 PDF를 한 번 가져와
   이 브라우저에만 보관합니다. 비밀값은 localStorage, PDF는 IndexedDB.
   서버로는 아무것도 전송되지 않습니다. */
const VAULT_KEY='trip2026.vault';
let vaultSecrets=null;
try{ vaultSecrets = JSON.parse(store.get(VAULT_KEY)||'null'); }catch(e){ vaultSecrets=null; }
let vaultDocs = new Set();

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('indexedDB 없음')); return; }
    const q=indexedDB.open('trip2026-vault',1);
    q.onupgradeneeded=()=>{ q.result.createObjectStore('docs'); };
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
function idbReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function vaultDocPut(path,file){
  const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
  tx.objectStore('docs').put({name:file.name,type:file.type||'application/pdf',blob:file,savedAt:Date.now()},path);
  return new Promise((res,rej)=>{ tx.oncomplete=()=>{ vaultDocs.add(path); res(); }; tx.onerror=()=>rej(tx.error); });
}
async function vaultDocGet(path){ const db=await idbOpen(); return idbReq(db.transaction('docs').objectStore('docs').get(path)); }
async function vaultDocKeys(){ const db=await idbOpen(); return idbReq(db.transaction('docs').objectStore('docs').getAllKeys()); }
async function vaultDocDel(path){
  const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
  tx.objectStore('docs').delete(path);
  return new Promise((res,rej)=>{ tx.oncomplete=()=>{ vaultDocs.delete(path); res(); }; tx.onerror=()=>rej(tx.error); });
}
async function vaultClear(){
  store.del(VAULT_KEY); vaultSecrets=null;
  try{
    const db=await idbOpen(); const tx=db.transaction('docs','readwrite');
    tx.objectStore('docs').clear();
    await new Promise(res=>{ tx.oncomplete=res; tx.onerror=res; });
  }catch(e){}
  vaultDocs.clear();
}
/* private.js 내용을 통째로 붙여넣으면 SECRETS 객체 부분만 뽑아 파싱합니다. */
function parseSecretsText(txt){
  const s=txt.indexOf('{'), e2=txt.lastIndexOf('}');
  if(s<0||e2<=s) throw new Error('형식 오류');
  const obj=(new Function('"use strict";return ('+txt.slice(s,e2+1)+')'))();
  if(!obj||typeof obj!=='object') throw new Error('형식 오류');
  const out={};
  for(const k in obj){ if(typeof obj[k]==='string'&&obj[k].trim()) out[k]=obj[k].trim(); }
  if(Object.keys(out).length===0) throw new Error('값 없음');
  return out;
}
/* IndexedDB에 저장한 PDF를 blob URL로 엽니다. 팝업 차단 대비로 창을 먼저 엽니다. */
function openVaultDoc(path){
  let w=null; try{ w=window.open('','_blank'); }catch(e){}
  vaultDocGet(path).then(rec=>{
    if(!rec){ if(w)w.close(); toast('저장된 파일이 없어요'); return; }
    const url=URL.createObjectURL(rec.blob);
    if(w) w.location=url; else location.href=url;
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }).catch(()=>{ if(w)w.close(); toast('파일을 열지 못했어요'); });
}
/* 대시보드가 참조하는 확인서 목록 (예약 카드 + 자료 체크리스트) */
function expectedDocs(){
  const list=[];
  const add=(path,label)=>{ if(path&&!list.some(x=>x.path===path)) list.push({path,label}); };
  TRIP.bookings.forEach(b=>{ add(b.doc, b.title+(b.doc2?' · 승차권':' · 확인서')); add(b.doc2, b.title+' · 좌석 예약서'); });
  TRIP.docs.forEach(x=>add(x.file, x.label));
  return list;
}

/* private.js 가 있으면(심볼릭 링크 환경) 그 값을, 없으면 가져온 값을 씁니다. */
const localFiles = ()=> typeof SECRETS !== 'undefined' && !!SECRETS;
const secret = (k)=>{
  if(typeof SECRETS !== 'undefined' && SECRETS && SECRETS[k]) return SECRETS[k];
  if(vaultSecrets && vaultSecrets[k]) return vaultSecrets[k];
  return null;
};
const hasSecrets = ()=> (typeof SECRETS !== 'undefined' && SECRETS && Object.keys(SECRETS).length > 0)
                     || (vaultSecrets && Object.keys(vaultSecrets).length > 0);
/* 확인서 버튼: 로컬 파일이 있으면 링크, 가져온 PDF가 있으면 blob 열기, 둘 다 없으면 숨김 */
function docBtn(path,label){
  if(!path) return '';
  if(localFiles()) return `<a class="btn" href="${path}" target="_blank" rel="noopener">${label}</a>`;
  if(vaultDocs.has(path)) return `<button class="btn" data-doc="${esc(path)}">${label}</button>`;
  return '';
}
/* 공유용 웹(Pages)에서는 보기 전용. private.js 또는 가져온 비밀값이 있는 내 기기에서만 편집 가능. */
let EDITABLE = hasSecrets();

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1600);
}
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast('복사했어요')).catch(()=>toast('복사하지 못했어요'));
}

/* ── 헤더 ───────────────────────────────────────────────── */
function renderHeader(){
  $('#hEyebrow').textContent = TRIP.subtitle + ' · ' + (TRIP.days-1) + '박 ' + TRIP.days + '일';
  $('#hTitle').textContent = TRIP.title;
  $('#foot').textContent = store.ok
    ? 'index.html 상단 TRIP 객체를 고치면 화면에 반영됩니다.'
    : '이 브라우저에서는 체크 상태가 저장되지 않아요. 새로고침하면 초기화됩니다.';
}

/* ── 홈 ─────────────────────────────────────────────────── */
function renderHome(){
  const root=$('#tab-home'); root.innerHTML='';
  const dLeft = dayDiff(parse(TRIP.startDate), TODAY);
  const totalTodo = TRIP.todos.length;
  const doneTodo = TRIP.todos.filter(t=>t.done||state[t.id]).length;
  const pct = Math.round(doneTodo/totalTodo*100);

  root.appendChild(el(`
    <div class="hero">
      <div class="h-lab">출발까지</div>
      <div class="h-num">${dLeft>0?('D-'+dLeft):(dLeft===0?'D-DAY':'여행 중')}</div>
      <div class="h-sub">2026년 9월 18일 금요일 09:50 · 인천 T1 출발</div>
      <div class="h-bar"><i style="width:${pct}%"></i></div>
      <div class="h-meta"><span>예약 준비 ${doneTodo}/${totalTodo}</span><span>${pct}%</span></div>
    </div>`));

  /* 마감 */
  /* 남은 마감을 먼저, 지난 항목은 뒤로 */
  const dl = TRIP.deadlines.slice().sort((a,b)=>{
    const pa = dayDiff(parse(a.date),TODAY) < 0, pb = dayDiff(parse(b.date),TODAY) < 0;
    if(pa!==pb) return pa?1:-1;
    return parse(a.date)-parse(b.date);
  });
  const dlCard = el('<div class="card"></div>');
  dl.forEach(d=>{
    const n = dayDiff(parse(d.date), TODAY);
    const passed = n<0;
    const tone = passed ? '' : (n<=14 ? 'red' : (d.tone==='blue'?'blue':''));
    dlCard.appendChild(el(`
      <div class="row">
        <div class="rt">
          <b>${esc(d.label)}${d.estimate?' <span class="chip">추정</span>':''}</b>
          <small>${fmtMD(d.date)} ${d.date.includes('T')?d.date.split('T')[1]:''} · ${esc(d.desc)}</small>
        </div>
        <div class="rv"><span class="chip ${tone}">${passed?'지남':ddayText(d.date)}</span></div>
      </div>`));
  });
  if(!EDITABLE){
    root.appendChild(el('<div class="card"><div class="note">공유용 보기 전용 화면이에요. 체크 상태는 바꿀 수 없습니다.</div></div>'));
  }
  root.appendChild(el('<div class="sec-title">마감</div>'));
  root.appendChild(dlCard);

  /* 가장 급한 일 */
  const next = TRIP.todos.filter(t=>!(t.done||state[t.id])).slice(0,3);
  root.appendChild(el('<div class="sec-title">지금 할 일</div>'));
  if(next.length===0){
    root.appendChild(el('<div class="card"><div class="card-pad muted">남은 예약이 없어요.</div></div>'));
  } else {
    const c = el('<div class="card"></div>');
    next.forEach(t=>{
      c.appendChild(el(`
        <div class="chk" data-id="${t.id}">
          ${icon(t.type,true)}
          <div class="ct"><b>${esc(t.title)}</b><small>${esc(t.when)}${t.why?' · '+esc(t.why):''}</small></div>
          ${t.urgent?'<span class="chip red">최우선</span>':''}
          <div class="box">${checkSvg()}</div>
        </div>`));
    });
    root.appendChild(c);
  }

  /* 확정 요약 */
  root.appendChild(el('<div class="sec-title">확정된 것</div>'));
  const cc = el('<div class="card"></div>');
  TRIP.bookings.forEach(b=>{
    cc.appendChild(el(`
      <div class="row">
        ${icon(b.type,true)}
        <div class="rt"><b>${esc(b.title)}</b><small>${esc(b.sub)}</small></div>
        <div class="rv">${fmtMD(b.date)}</div>
      </div>`));
  });
  root.appendChild(cc);
  bindChecks(root);
}

function checkSvg(){
  return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
/* 항목 유형 아이콘 — 인라인 SVG (이모지 대신) */
const ICONS = {
  flight: '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>',
  train:  '<path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H14l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>',
  stay:   '<path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>',
  ticket: '<path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>',
  tour:   '<path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>',
  seat:   '<path d="M7.59 5.41c-.78-.78-.78-2.05 0-2.83.78-.78 2.05-.78 2.83 0 .78.78.78 2.05 0 2.83-.79.79-2.05.79-2.83 0zM6 16V7H4v9c0 2.76 2.24 5 5 5h6v-2H9c-1.66 0-3-1.34-3-3zm14 4.07L14.93 15H11.5v-3.68c1.4 1.15 3.6 2.16 5.5 2.16v-2.16c-1.66.02-3.61-.87-4.67-2.04l-1.4-1.55c-.19-.21-.43-.38-.69-.5-.29-.14-.62-.23-.96-.23h-.03C8.01 7 7 8.01 7 9.25V15c0 1.66 1.34 3 3 3h5.07l3.5 3.5L20 20.07z"/>',
  post:   '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>'
};
const TYPE_LABEL = { flight:'항공', train:'기차', stay:'숙소', ticket:'입장권', tour:'투어', seat:'좌석', post:'게시' };
function icon(type, small){
  const t = ICONS[type] ? type : 'post';
  return `<div class="ic ${t} ${small?'sm':''}" aria-label="${TYPE_LABEL[t]}"><svg viewBox="0 0 24 24">${ICONS[t]}</svg></div>`;
}
const chevSvg = '<span class="chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';

function moveIcon(type){
  if(type==='flight') return '<span class="chip blue">항공</span>';
  if(type==='train')  return '<span class="chip green">기차</span>';
  return '';
}

/* ── 일정 ───────────────────────────────────────────────── */
function renderPlan(){
  const root=$('#tab-plan'); root.innerHTML='';
  root.appendChild(el('<div class="sec-title">전체 일정</div>'));
  root.appendChild(el('<div class="sec-desc">날짜를 누르면 상세가 열립니다.</div>'));
  const card = el('<div class="card"></div>');

  TRIP.itinerary.forEach((d,i)=>{
    /* 이동일은 도착 도시 색으로 표시 */
    const cityKey = (d.city === '이동' && d.stay && TRIP.cities[d.stay]) ? d.stay : d.city;
    const color = (TRIP.cities[cityKey]||{}).color || '#8B95A1';
    const openKey = 'day.'+d.date;
    const isOpen = !!state[openKey];
    const past = dayDiff(parse(d.date), TODAY) < 0;
    const node = el(`
      <div class="day ${isOpen?'open':''}" data-day="${openKey}" style="${past?'opacity:.5':''}">
        <span class="dot" style="color:${color}"></span>
        <div class="dhead">
          <span class="ddate">${fmtMD(d.date)} ${d.dow}</span>
          <span class="dlab">${esc(d.label)}</span>
          <span class="chip">${ddayText(d.date)}</span>
        </div>
        <div class="dmeta">
          ${d.move?moveIcon(d.move):''}
          ${d.stay?`<span class="chip">${esc(d.stay)} 숙박${d.stayFixed?' · 확정':''}</span>`:''}
          ${d.flexible?'<span class="chip orange">유연한 날</span>':''}
        </div>
        <div class="dbody">
          <ul>${(d.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          ${d.options?`<div class="opts">${d.options.map(o=>`<div class="o">${esc(o)}</div>`).join('')}</div>`:''}
          ${d.tip?`<div class="tip"><b>참고</b>${esc(d.tip)}</div>`:''}
        </div>
      </div>`);
    card.appendChild(node);
  });
  root.appendChild(card);

  root.appendChild(el('<div class="sec-title">숙박 배분</div>'));
  root.appendChild(el(`
    <div class="card"><div class="card-pad">
      <div class="kv"><div class="k">슈투트가르트</div><div class="v">1박 · 9/18 <span class="chip green">확정</span></div></div>
      <div class="kv"><div class="k">뮌헨</div><div class="v">3박 · 9/19~22 <span class="chip green">확정</span></div></div>
      <div class="kv"><div class="k">포르투</div><div class="v">3박 · 9/22~25 <span class="chip red">미정</span></div></div>
      <div class="kv"><div class="k">리스본</div><div class="v">3박 · 9/25~28 <span class="chip red">미정</span></div></div>
      <div class="kv"><div class="k">기내</div><div class="v">1박 · 9/28</div></div>
    </div></div>`));

  root.querySelectorAll('.day').forEach(n=>{
    n.addEventListener('click',()=>{ const k=n.dataset.day; state[k]=!state[k]; save(); n.classList.toggle('open'); });
  });
}

/* ── 예약 ───────────────────────────────────────────────── */
function renderBook(){
  const root=$('#tab-book'); root.innerHTML='';

  root.appendChild(el('<div class="sec-title">확정 예약</div>'));
  root.appendChild(el('<div class="sec-desc">항목을 누르면 상세가 열립니다.</div>'));
  if(!hasSecrets()){
    root.appendChild(el('<div class="card"><div class="note">예약번호와 PIN은 이 화면에 저장돼 있지 않아요. private.js 가 있는 기기이거나, 정보 탭에서 "내 기기 데이터"로 가져온 경우에만 보입니다. 현장에서는 Booking.com 앱이나 항공사 앱에서 확인하세요.</div></div>'));
  }
  TRIP.bookings.forEach(b=>{
    const key='bk.'+b.id, open=!!state[key];
    const card = el(`<div class="card bk ${open?'open':''}" data-key="${key}">
      <div class="bk-head">
        ${icon(b.type)}
        <div class="bt"><b>${esc(b.title)}</b><small>${fmtMD(b.date)} · ${esc(b.sub)}</small></div>
        <span class="chip green">확정</span>
        ${chevSvg}
      </div>
      <div class="bk-body">
        <div class="card-pad">
          ${b.rows.map(r=>{
            const sv = r.sk ? secret(r.sk) : null;
            const v  = r.sk ? (sv ?? '비공개') : r.v;
            const hidden = r.sk && sv === null;
            return `<div class="kv"><div class="k">${esc(r.k)}</div><div class="v ${r.warn?'warn':''}">${esc(v)}${(r.copy && !hidden)?` <button class="chip blue" data-copy="${esc(v)}" style="border:none;cursor:pointer;font-family:inherit">복사</button>`:''}${hidden?' <span class="chip">내 기기에서만</span>':''}</div></div>`;
          }).join('')}
          ${b.breakdown?`<div class="muted" style="margin-top:6px">${esc(b.breakdown)}</div>`:''}
          ${b.channel?`<div class="muted" style="margin-top:6px">예약처 ${esc(b.channel)}</div>`:''}
          ${!b.docSubmitted?'<div style="margin-top:12px"><span class="chip red">확인서 미제출</span></div>':''}
          ${b.pendingTicket?'<div style="margin-top:12px"><span class="chip orange">승차권 확인 필요</span> <span class="muted">좌석 예약서만 받았어요. 승차권 PDF가 따로 있는지 확인하세요.</span></div>':''}
        </div>
        ${b.note?`<div class="note">${esc(b.note)}</div>`:''}
        ${(()=>{ const btns=(b.map?`<a class="btn" href="${b.map}" target="_blank" rel="noopener">지도</a>`:'')+docBtn(b.doc,b.docLabel||(b.doc2?'승차권':'확인서 열기'))+docBtn(b.doc2,b.doc2Label||'좌석 예약서');
          return btns?`<div class="btn-row" style="padding-top:16px">${btns}</div>`:''; })()}
      </div>
    </div>`);
    card.querySelector('.bk-head').addEventListener('click',()=>{ state[key]=!state[key]; save(); card.classList.toggle('open'); });
    root.appendChild(card);
  });

  root.appendChild(el('<div class="sec-title">남은 예약</div>'));
  root.appendChild(el(`<div class="sec-desc">우선순위 순입니다. 줄을 누르면 설명이 열립니다.${EDITABLE?' 오른쪽 박스로 완료 표시를 해요.':''}</div>`));
  const c = el('<div class="card"></div>');
  TRIP.todos.forEach(t=>{
    const okey='td.'+t.id;
    const node = el(`
      <div class="td ${(t.done||state[t.id])?'done':''} ${state[okey]?'open':''}">
        <div class="td-head">
          ${icon(t.type)}
          <div class="tt"><b>${esc(t.title)}</b><small>${esc(t.when)} · ${TYPE_LABEL[t.type]||''}${t.urgent && !(t.done||state[t.id])?' · <span class="chip red" style="padding:2px 6px;font-size:11px">최우선</span>':''}</small></div>
          <div class="box" data-id="${t.id}">${checkSvg()}</div>
        </div>
        ${t.why?`<div class="td-body">${esc(t.why)}</div>`:''}
      </div>`);
    node.querySelector('.td-head').addEventListener('click',e=>{
      if(e.target.closest('.box')) return;
      if(!t.why) return;
      state[okey]=!state[okey]; save(); node.classList.toggle('open');
    });
    node.querySelector('.box').addEventListener('click',e=>{ e.stopPropagation(); if(t.done){ toast('확정된 항목이에요'); return; } toggle(t.id); });
    c.appendChild(node);
  });
  root.appendChild(c);

  root.appendChild(el('<div class="sec-title">뮌헨 숙소 후보</div>'));
  const m = el('<div class="card"></div>');
  TRIP.munichCandidates.forEach(x=>{
    m.appendChild(el(`
      <div class="row">
        ${icon('stay',true)}
        <div class="rt"><b>${esc(x.name)}${x.rank?` <span class="chip blue">${esc(x.rank)}</span>`:''}</b><small>${esc(x.note)}</small></div>
        <div class="rv">${x.rating? x.rating.toFixed(1) : '—'}</div>
      </div>`));
  });
  m.appendChild(el(`<div class="note">${esc(TRIP.munichRule)}</div>`));
  root.appendChild(m);

  root.appendChild(el('<div class="sec-title">받아야 할 자료</div>'));
  root.appendChild(el(`<div class="sec-desc">${EDITABLE?'확인서를 받으면 docs 에 넣고 체크하세요.':'확인서 수령 현황입니다.'}</div>`));
  const d = el('<div class="card"></div>');
  TRIP.docs.forEach(x=>{
    if(x.done){
      d.appendChild(el(`
        <div class="row">
          <div class="rt"><b>${esc(x.label)}</b><small>${esc(x.need)}</small></div>
          <div class="rv">${(x.file && localFiles())?`<a class="chip blue" href="${x.file}" target="_blank" rel="noopener" style="text-decoration:none">열기</a>`:(x.file && vaultDocs.has(x.file))?`<button class="chip blue" data-doc="${esc(x.file)}" style="border:none;cursor:pointer;font-family:inherit">열기</button>`:'<span class="chip green">확인</span>'}</div>
        </div>`));
    } else {
      d.appendChild(el(`
        <div class="chk ${state[x.id]?'on':''}" data-id="${x.id}">
          <div class="box">${checkSvg()}</div>
          <div class="ct"><b>${esc(x.label)}</b><small>${esc(x.need)}</small></div>
        </div>`));
    }
  });
  root.appendChild(d);

  bindChecks(root);
  root.querySelectorAll('[data-copy]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();copy(b.dataset.copy);});
  });
  root.querySelectorAll('[data-doc]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();openVaultDoc(b.dataset.doc);});
  });
}

/* ── 맛집 ───────────────────────────────────────────────── */
function renderFood(){
  const root=$('#tab-food'); root.innerHTML='';
  const cities=[...new Set(TRIP.food.map(f=>f.city))];
  if(cities.length===0){
    root.appendChild(el('<div class="sec-title">맛집</div>'));
    root.appendChild(el('<div class="card"><div class="card-pad muted">목록을 준비하고 있어요.</div></div>'));
    return;
  }
  let city = state['food.city']; if(!cities.includes(city)) city = cities[0];
  const cats=[...new Set(TRIP.food.filter(f=>f.city===city).map(f=>f.cat))];
  let cat = state['food.cat']; if(cat && !cats.includes(cat)) cat = null;

  root.appendChild(el('<div class="sec-title">맛집</div>'));
  root.appendChild(el(`<div class="sec-desc">${esc(TRIP.foodMeta.note)} (${esc(TRIP.foodMeta.updated)} 조사)</div>`));

  const cityBar=el('<div class="fchips"></div>');
  cities.forEach(c=>{
    const color=(TRIP.cities[c]||{}).color;
    const b=el(`<button class="fc ${c===city?'on':''}">${esc(c)}</button>`);
    b.addEventListener('click',()=>{ state['food.city']=c; state['food.cat']=null; save(); renderFood(); });
    cityBar.appendChild(b);
  });
  root.appendChild(cityBar);

  const catBar=el('<div class="fchips"></div>');
  const allBtn=el(`<button class="fc ${!cat?'on':''}">전체</button>`);
  allBtn.addEventListener('click',()=>{ state['food.cat']=null; save(); renderFood(); });
  catBar.appendChild(allBtn);
  cats.forEach(c=>{
    const b=el(`<button class="fc ${c===cat?'on':''}">${esc(c)}</button>`);
    b.addEventListener('click',()=>{ state['food.cat']=c; save(); renderFood(); });
    catBar.appendChild(b);
  });
  root.appendChild(catBar);

  const list=TRIP.food.filter(f=>f.city===city && (!cat || f.cat===cat));
  const card=el('<div class="card"></div>');
  list.forEach(f=>{
    const rev = f.reviews!=null ? f.reviews.toLocaleString('ko-KR') : null;
    const node=el(`
      <div class="food-row">
        <div class="fr-head">
          <div class="fr-main">
            <b>${esc(f.name_ko)}</b> ${f.kr?'<span class="chip orange" style="font-size:11px;padding:2px 7px">한국인 추천</span>':''}
            <div class="fr-sub">${esc(f.cat)} · ${esc(f.price||'')} · ${esc(f.area)}</div>
          </div>
          <div class="fr-rate">
            ${f.rating!=null?`<b><span class="star">★</span> ${f.rating.toFixed(1)}</b><small>리뷰 ${rev}</small>`:'<small>평점 미확인</small>'}
          </div>
        </div>
        <div class="fr-body">
          <div><b style="color:var(--t1)">${esc(f.name)}</b></div>
          <div style="margin-top:4px">추천 — ${esc(f.menu)}</div>
          <div style="margin-top:4px">${esc(f.note)}</div>
          <a class="btn" href="${f.gmaps}" target="_blank" rel="noopener">구글맵에서 열기</a>
        </div>
      </div>`);
    node.querySelector('.fr-head').addEventListener('click',()=>node.classList.toggle('open'));
    card.appendChild(node);
  });
  if(list.length===0) card.appendChild(el('<div class="card-pad muted">이 분류에는 아직 없어요.</div>'));
  root.appendChild(card);
}

/* ── 정보 ───────────────────────────────────────────────── */
function renderInfo(){
  const root=$('#tab-info'); root.innerHTML='';

  root.appendChild(el('<div class="sec-title">알아둘 것</div>'));
  const r = el('<div class="card"></div>');
  TRIP.risks.forEach(x=>{
    r.appendChild(el(`<div class="row"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`));
  });
  root.appendChild(r);

  /* 날씨 */
  root.appendChild(el('<div class="sec-title">날씨</div>'));
  root.appendChild(el(`<div class="sec-desc">${esc(TRIP.weather.note)} (${esc(TRIP.weather.updated)} 조사)</div>`));
  const w = el('<div class="card"></div>');
  TRIP.weather.cities.forEach(c=>{
    const color=(TRIP.cities[c.city]||{}).color||'#8B95A1';
    const node = el(`
      <div class="row">
        <div class="rt">
          <b><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></span>${esc(c.city)} <span class="muted" style="font-weight:600">${esc(c.when)}</span></b>
          <small>비 ${esc(c.rain)}<br><span style="opacity:.9">${esc(c.tip)}</span></small>
        </div>
        <div class="rv" style="white-space:nowrap"><b>${c.hi}°</b> <span class="muted">/ ${c.lo}°</span></div>
      </div>`);
    w.appendChild(node);
  });
  root.appendChild(w);

  const wh = el('<div class="card"></div>');
  TRIP.weather.highlights.forEach(x=>{
    wh.appendChild(el(`<div class="row"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`));
  });
  wh.appendChild(el(`<div class="note">챙길 것<br>${TRIP.weather.packing.map(x=>'· '+esc(x)).join('<br>')}</div>`));
  root.appendChild(wh);

  root.appendChild(el('<div class="sec-title">앵커 이벤트</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="row"><div class="rt"><b>AMB 2026</b><small>국제 금속가공 전시회 · 2026/09/15~19 · Messe Stuttgart (공항 옆)</small></div><div class="rv">9/19 관람</div></div>
      <div class="row"><div class="rt"><b>옥토버페스트</b><small>2026/09/19~10/04 · Theresienwiese, 뮌헨</small></div><div class="rv">9/20</div></div>
    </div>`));

  root.appendChild(el('<div class="sec-title">동행</div>'));
  root.appendChild(el(`
    <div class="card">
      <div class="card-pad">
        <div class="kv"><div class="k">대상</div><div class="v">뮌헨 9/19~22 · 포르투 9/22~25 · 리스본 9/25~28</div></div>
        <div class="kv"><div class="k">모집처</div><div class="v">네이버 카페 유랑</div></div>
        <div class="kv"><div class="k">비고</div><div class="v">슈투트가르트 제외 · 부분 동행 환영</div></div>
      </div>
      <div class="btn-row"><a class="btn primary" href="${TRIP.openChat}" target="_blank" rel="noopener">오픈채팅 열기</a></div>
    </div>`));

  /* 내 기기 데이터 — private.js 없는 기기(폰)에서 비밀값·확인서를 가져와 보관 */
  root.appendChild(el('<div class="sec-title">내 기기 데이터</div>'));
  if(localFiles()){
    root.appendChild(el('<div class="card"><div class="note">이 기기는 private.js 를 직접 읽고 있어요. 가져오기가 필요 없습니다.</div></div>'));
  } else {
    const nSec = vaultSecrets ? Object.keys(vaultSecrets).length : 0;
    const card = el(`<div class="card">
      <div class="card-pad">
        <div class="kv"><div class="k">비밀값</div><div class="v">${nSec? nSec+'개 가져옴' : '없음'}</div></div>
        <div class="kv"><div class="k">확인서</div><div class="v">${vaultDocs.size}개 저장됨</div></div>
      </div>
      <div class="note">여기서 가져온 값과 파일은 이 브라우저에만 저장되고 어디로도 전송되지 않아요. 내 폰에서만 쓰고, 공용 기기에서는 사용하지 마세요.</div>
      <div class="btn-row" style="padding-top:16px">
        <button class="btn" id="vSecBtn">private.js 붙여넣기</button>
        ${(nSec||vaultDocs.size)?'<button class="btn" id="vClrBtn">모두 지우기</button>':''}
      </div>
      <div id="vSecBox" class="hidden" style="padding:0 20px 16px">
        <textarea id="vSecTa" rows="6" placeholder="private.js 내용 전체를 붙여넣으세요" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:none;background:var(--card-sub);color:inherit;font-family:inherit;font-size:13px"></textarea>
        <div class="btn-row" style="padding:8px 0 0"><button class="btn primary" id="vSecSave">저장</button></div>
      </div>
      <div id="vDocRows"></div>
    </div>`);
    root.appendChild(card);

    const rows = card.querySelector('#vDocRows');
    expectedDocs().forEach(dc=>{
      const have = vaultDocs.has(dc.path);
      const row = el(`<div class="row">
        <div class="rt"><b>${esc(dc.label)}</b><small>${have?'저장됨 · 눌러서 열기':'없음'}</small></div>
        <div class="rv">
          ${have?`<button class="chip" data-doc="${esc(dc.path)}" style="border:none;cursor:pointer;font-family:inherit">열기</button> `:''}
          <label class="chip ${have?'':'blue'}" style="cursor:pointer">${have?'교체':'추가'}<input type="file" accept="application/pdf,.pdf" hidden></label>
        </div>
      </div>`);
      row.querySelector('input[type=file]').addEventListener('change',e=>{
        const f=e.target.files[0]; if(!f) return;
        vaultDocPut(dc.path,f).then(()=>{ toast('저장했어요'); render(); }).catch(()=>toast('저장하지 못했어요'));
      });
      const openBtn=row.querySelector('[data-doc]');
      if(openBtn) openBtn.addEventListener('click',()=>openVaultDoc(dc.path));
      rows.appendChild(row);
    });

    $('#vSecBtn').addEventListener('click',()=>{ $('#vSecBox').classList.toggle('hidden'); });
    $('#vSecSave').addEventListener('click',()=>{
      try{
        const parsed = parseSecretsText($('#vSecTa').value);
        store.set(VAULT_KEY, JSON.stringify(parsed));
        vaultSecrets = parsed; EDITABLE = hasSecrets();
        toast(Object.keys(parsed).length+'개 값을 가져왔어요'); render();
      }catch(e){ toast('내용을 읽지 못했어요. 파일 전체를 붙여넣어 주세요'); }
    });
    const clr=$('#vClrBtn');
    if(clr) clr.addEventListener('click',()=>{
      if(!confirm('가져온 비밀값과 확인서를 이 기기에서 모두 지울까요?')) return;
      vaultClear().then(()=>{ EDITABLE = hasSecrets(); render(); toast('지웠어요'); });
    });
  }

  if(EDITABLE){
    root.appendChild(el('<div class="sec-title">데이터 관리</div>'));
    const reset = el('<div class="card"><div class="btn-row" style="padding:16px 20px"><button class="btn" id="btnReset">체크 상태 초기화</button></div></div>');
    root.appendChild(reset);
    $('#btnReset').addEventListener('click',()=>{
      if(confirm('체크한 내용을 모두 지울까요?')){ store.del(KEY); for(const k in state) delete state[k]; render(); toast('초기화했어요'); }
    });
  }
}

function bindChecks(root){
  root.querySelectorAll('.chk').forEach(n=>{
    n.addEventListener('click',()=>toggle(n.dataset.id));
  });
}

/* ── 탭 ─────────────────────────────────────────────────── */
const TABS=[{id:'home',label:'홈'},{id:'plan',label:'일정'},{id:'book',label:'예약'},{id:'food',label:'맛집'},{id:'info',label:'정보'}];
let cur = store.get('trip2026.tab') || 'home';
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  TABS.forEach(t=>{
    const b=el(`<button class="${cur===t.id?'on':''}">${t.label}</button>`);
    b.addEventListener('click',()=>{ cur=t.id; store.set('trip2026.tab',cur); render(); window.scrollTo(0,0); });
    nav.appendChild(b);
  });
  TABS.forEach(t=>$('#tab-'+t.id).classList.toggle('hidden', t.id!==cur));
}

function render(){
  document.body.classList.toggle('readonly', !EDITABLE);
  renderHeader();
  renderHome(); renderPlan(); renderBook(); renderFood(); renderInfo();
  renderNav();
}
render();
/* 저장된 확인서 목록을 불러온 뒤 문서 버튼이 뜨도록 다시 그립니다. */
if(!localFiles() && window.indexedDB){
  vaultDocKeys().then(keys=>{ vaultDocs=new Set(keys); if(keys.length) render(); }).catch(()=>{});
}
</script>
</body>
</html>
